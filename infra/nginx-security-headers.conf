# Security headers for signal-to-noise.co, included in every location block of
# nginx-signal-to-noise.conf. Installed on the VM at
# /etc/nginx/snippets/s2n-security-headers.conf.
#
# Why an include, not server-level add_header: in nginx 1.24 a location that
# sets any add_header (every location here sets Cache-Control) drops all
# add_header lines inherited from the server block. So each location includes
# this file explicitly.
#
# "always" sends the header on error responses (404s) too.

# HTTPS only, for a year. No includeSubDomains (mail and other records under
# the domain are not web hosts) and no preload list yet.
add_header Strict-Transport-Security "max-age=31536000" always;

# Never guess a file's type from its contents.
add_header X-Content-Type-Options "nosniff" always;

# No other site may show these pages in a frame (old header plus the CSP form).
add_header X-Frame-Options "SAMEORIGIN" always;

# Send only the site's origin to other sites, the full URL within the site.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The site uses none of these browser features.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# Enforced now: the parts of a content policy that cannot break a page.
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

# Report-only for now: the full script and resource policy. The site uses
# small inline scripts (Astro is:inline: theme flag, covers, search), so this
# is watched in the browser console before it is enforced.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
