# nginx site config for signal-to-noise.co — canonical copy (VM: s2n-web).
# Installed at /etc/nginx/sites-enabled/ on the VM. Keep this file in sync
# with the server; it is the reviewed source of truth for cache headers.
#
# Cache strategy (LCP fix, Aug 2026):
# - /_astro/*: content-hashed filenames -> immutable, 1 year. (^~ so the
#   image/font regex below cannot outrank it back down to 30 days.)
# - images/fonts/icons: 30 days, public.
# - HTML and everything else: browser always revalidates (max-age=0) but the
#   Cloudflare edge may hold it a day (s-maxage=86400) — deploy.sh purges the
#   edge on every deploy, so stale HTML never outlives a release.

server {

    server_name signal-to-noise.co www.signal-to-noise.co;

    root /var/www/signal-to-noise/dist;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=86400";
    }

    # Cache static assets aggressively (they have content-hashed filenames)
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images, fonts, icons: long-lived at edge and browser (30 days).
    location ~* \.(webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/signal-to-noise.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/signal-to-noise.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.signal-to-noise.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = signal-to-noise.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;

    server_name signal-to-noise.co www.signal-to-noise.co;
    return 404; # managed by Certbot




}
